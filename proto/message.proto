syntax = "proto3";
package core;
import "google/protobuf/empty.proto";

message Message {
  string message_id = 1;
  string content = 2;
  string name = 3;
  string name_color = 4;
}

service MessageService {
    rpc Send(Message) returns (google.protobuf.Empty);
    rpc Listen(google.protobuf.Empty) returns (stream Message);
}
