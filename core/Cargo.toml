[package]
name = "core"
version = "0.1.0"
edition = "2024"

[dependencies]
tonic = { version = "0.14.9" }
prost = { version = "0.14.4" }
tonic-prost = { version = "0.14.9" }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tokio-stream = { version = "0.1.19" }
proto = { path = "../proto" }
env_logger = { version = "0.11.11" }
log = { version = "0.4.35" }
tonic-web = { version = "0.14.9" }
tower-http = { version = "0.7.1", features = ["cors"] }
